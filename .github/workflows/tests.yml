# LOOP's test suite on every push and pull request (no Pi or GTK needed: the window test uses stand-ins).
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools for the idle-video test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install pillow
      - name: Tests
        run: |
          set -e
          for t in tests/test_*.py tests/smoke_ui.py; do echo "== $t"; python3 "$t"; done

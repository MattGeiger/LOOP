<!doctype html>
<!-- WTH display idle screen, portrait 1080x1920. Rendered by render.sh. -->
<html><head><meta charset="utf-8"><title>WTH Idle Screen Portrait</title>
<style>
  :root { --navy:#173F6E; --aqua:#7ACCC8; --sun:#FFDF4F; --white:#FFFFFF; }
  html,body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { background:var(--navy); font-family:"Avenir Next","Helvetica Neue",sans-serif; color:var(--white); position:relative; }
  .mark { position:absolute; left:150px; bottom:-200px; height:1040px; }
  .col { position:absolute; left:100px; right:100px; top:110px; }
  .logo { width:620px; display:block; }
  h1 { margin:150px 0 0; font-size:96px; line-height:1.06; font-weight:700; letter-spacing:-0.5px; }
  .sub { margin:32px 0 0; font-size:40px; line-height:1.35; font-weight:500; color:var(--aqua); }
  .bar { width:96px; height:8px; border-radius:4px; background:var(--sun); margin:56px 0 26px; }
  .store { font-size:34px; font-weight:600; line-height:1.3; }
  .hours { margin-top:8px; font-size:30px; font-weight:500; opacity:.85; }
</style></head>
<body>
  <img class="mark" src="assets/mark-color.svg" alt="">
  <div class="col">
    <img class="logo" src="assets/logo-white.svg" alt="William Temple House">
    <h1>Every purchase<br>supports our<br>neighbors.</h1>
    <p class="sub">Providing food, counseling, and connection since 1965.</p>
    <div class="bar"></div>
    <div class="store">William Temple House Thrift Store<br>2230 NW Glisan St</div>
  </div>
</body></html>
